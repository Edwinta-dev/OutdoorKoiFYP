[pytest]
# Run from Backend/ with: python -m pytest -q
# Tests mirror the koi package: tests/models, tests/api, tests/worker, ...
testpaths = tests
# Lets `python -m pytest` find koi without an install, and the test modules
# import the shared helpers in tests/conftest.py.
pythonpath = . tests
# Lets tests/conftest.py count passing assert statements and report the
# total in the terminal summary.
enable_assertion_pass_hook = true
