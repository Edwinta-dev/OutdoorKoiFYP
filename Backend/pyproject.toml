# Lint and type-check settings for the backend. Run from the repo root with
#   python tools/check.py backend
# pytest settings stay in pytest.ini.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# F: pyflakes, E: pycodestyle errors, I: isort, B: flake8-bugbear.
select = ["F", "E", "I", "B"]

[tool.ruff.lint.isort]
# DigitalTwin and Camera are flat script directories, not packages, so
# their sibling imports are first-party.
known-first-party = [
    "algae_engine", "app", "engine", "evaporation_engine", "forecast_utils",
    "poller", "pond_twin", "registry", "state_store", "conftest",
    "camera", "hsvEngine", "imageSchedule",
]
# The repository's supabase/ folder (SQL migrations) would otherwise make
# ruff treat the supabase client library as first-party.
known-third-party = ["supabase"]

[tool.mypy]
# Lenient baseline: untyped function bodies are not checked yet.
ignore_missing_imports = true
check_untyped_defs = false
explicit_package_bases = true

[[tool.mypy.overrides]]
# CI does not install supabase (the tests stub it), so the baseline above
# treats it as Any. Skip its bundled types when it is installed locally so
# mypy gives the same result on every machine.
module = ["supabase", "supabase.*", "postgrest", "postgrest.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
