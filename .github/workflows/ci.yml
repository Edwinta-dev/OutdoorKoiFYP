# Every job runs the same command a developer runs locally:
#   python tools/check.py <suite> --strict
# --strict turns a missing tool into a failure. No job contacts the live
# Supabase project, PythonAnywhere or the NEA API; the database job starts
# a disposable local Supabase stack on the runner (docs/dev.md).
name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      firmware: ${{ steps.filter.outputs.firmware }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - 'supabase/**'
              - 'tools/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'Embedded/**'
              - 'tools/check.py'
              - '.github/workflows/ci.yml'
            mobile:
              - 'MobileUI/mobile_app/**'
              - 'tools/check.py'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml
      - run: pip install -e "Backend[dev]"
      - run: python tools/check.py backend --strict

  database:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: pip install -e "Backend[dev]"
      # The database, REST API, auth and storage; the rest is not used.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: python tools/check.py database --strict

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install the ESP32 core and sketch libraries
        run: |
          arduino-cli config init --overwrite --additional-urls "$ESP32_INDEX"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install OneWire ArduinoJson ESPSupabase
      - run: python tools/check.py firmware --strict

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the golden images (MobileUI/mobile_app/test/goldens) are
          # compared pixel by pixel, and tools/update_goldens.py records them
          # with this same version. Change both together.
          flutter-version: 3.47.6
          cache: true
      - run: python tools/check.py mobile --strict
