              schema: *id001
        '403':
          description: Another account's pond
          content: *id009
        '500':
          description: Unexpected server error
          content: *id009
        '503':
          description: Storage or service not available
          content: *id009
      security:
      - bearerAuth: []
    put:
      operationId: put_camera_mask
      summary: Save a new camera water mask
      tags:
      - pond
      description: Saves the body's polygon as the pond's next mask version.
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraMaskUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id010
        '400':
          description: Invalid request
          content: &id011
            application/json:
              schema: *id001
        '401':
          description: Not signed in
          content: *id011
        '403':
          description: Another account's pond
          content: *id011
        '500':
          description: Unexpected server error
          content: *id011
        '503':
          description: Storage or service not available
          content: *id011
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/dashboard:
    get:
      operationId: get_dashboard
      summary: Everything the dashboard screen shows
      tags:
      - pond
      description: 'Latest reading of each channel with its own times, the three latest assessments and
        the hypoxia flag, next actions (empty for now), weather now from the pond''s assigned stations,
        and the 2-hour, 24-hour and 4-day forecasts. Reads only: no engine runs and nothing is written.
        Field rules: docs/api/README.md.'
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response.
        schema:
