      operationId: get_devices
      summary: Sensor node and camera health
      tags:
      - pond
      description: 'For the sensor node and the camera: when each was last seen (receipt time), its expected
        interval, contacts received and missed in the last 24 hours, and its status. For the sensor node
        also the battery trend from battery_mv readings, the last reset reason, each channel''s last usable
        sample time and how far those times can be trusted. Reads only.'
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
