            application/json:
              schema:
                $ref: '#/components/schemas/WaterChemistryAssessment'
          headers:
            ETag:
              description: Strong validator over the response body.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-cache
        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '401':
          description: Not signed in
          content: &id006
            application/json:
              schema: *id001
        '403':
          description: Another account's pond
          content: *id006
        '404':
          description: Pond or assessment not found
          content: *id006
        '500':
          description: Unexpected server error
          content: *id006
        '503':
          description: Storage or service not available
          content: *id006
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/assessments/evaporation:
