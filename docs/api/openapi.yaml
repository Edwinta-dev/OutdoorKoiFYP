  /v1/ponds/{pond}/calibration:
    get:
      operationId: get_calibration
      summary: Pond-specific model constants
      tags:
      - validation
      description: 'The evaporation shelter factor, the water/air temperature offset and lag, and the
        nitrification rate scale the models use for this pond now: the fit in force with its fit date,
        sample count and error, or the default while the fit is pending. history holds every stored version,
        oldest first.'
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      - name: If-None-Match
