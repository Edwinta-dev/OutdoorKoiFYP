          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: ingested_at plus fresh_for_seconds; status turns stale after it.
          title: Fresh Until
        note:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - channel
      - status
      - value
      - unit
      - sensor_type
      - source_row_id
      - ingested_at
      - sample_time
      - sample_time_basis
      - fresh_until
