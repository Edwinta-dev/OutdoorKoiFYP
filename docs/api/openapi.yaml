      properties:
        level:
          description: 'low: no reading yet, or the newest reading is older than 3 of the node''s expected
            intervals; reduced: a channel this assessment uses is that old, or the sensor gate has flagged
            it stale; high otherwise.'
          enum:
          - high
          - reduced
          - low
          title: Level
          type: string
        reasons:
          description: Why the level is not high; empty when it is.
          items:
            $ref: '#/components/schemas/ConfidenceReason'
          title: Reasons
          type: array
        newest_reading_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
