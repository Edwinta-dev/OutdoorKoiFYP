    TdsPrompt:
      additionalProperties: true
      properties:
        id:
          title: Id
          type: string
        detection:
          enum:
          - step
          - slope
          title: Detection
          type: string
        detected_at:
          format: date-time
          title: Detected At
          type: string
        event_at:
          format: date-time
          title: Event At
          type: string
        time_basis:
          enum:
          - ingestion
          - sample
          title: Time Basis
          type: string
        baseline_ppm:
          title: Baseline Ppm
          type: number
        level_ppm:
          title: Level Ppm
          type: number
        delta_ppm:
          title: Delta Ppm
          type: number
        slope_ppm_hour:
          anyOf:
          - type: number
          - type: 'null'
          title: Slope Ppm Hour
        confidence:
          description: Signal confidence; not an event-kind probability.
          maximum: 1
          minimum: 0
          title: Confidence
          type: number
        event_kinds:
          items:
            type: string
          title: Event Kinds
          type: array
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
        message:
          title: Message
          type: string
      required:
      - id
      - detection
      - detected_at
      - event_at
      - time_basis
      - baseline_ppm
      - level_ppm
      - delta_ppm
      - slope_ppm_hour
      - confidence
      - event_kinds
      - answer
      - message
      title: TdsPrompt
      type: object
    TdsPromptAnswer:
      additionalProperties: false
      properties:
        prompt:
          $ref: '#/components/schemas/TdsPrompt'
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
      required:
      - prompt
      - event_id
      title: TdsPromptAnswer
      type: object
    TdsPromptList:
      additionalProperties: false
      properties:
        enabled:
          title: Enabled
          type: boolean
        prompts:
          items:
            $ref: '#/components/schemas/TdsPrompt'
          title: Prompts
          type: array
      required:
      - enabled
      - prompts
      title: TdsPromptList
      type: object
    UvIndex:
      additionalProperties: false
      description: NEA's hourly UV index for the current Singapore hour.
      properties:
        status:
          description: 'ok: NEA reported this hour; missing: daylight hour with no report; night_derived:
            no report at night, value 0 by convention, not a measurement.'
          enum:
          - ok
          - missing
          - night_derived
          title: Status
          type: string
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        unit:
          const: UV index
          default: UV index
          title: Unit
          type: string
        hour_start:
          description: Start of the current Singapore hour.
          format: date-time
          title: Hour Start
          type: string
        daylight:
          description: 07:00 to 19:00 Singapore time (a fixed convention, not sunrise).
          title: Daylight
          type: boolean
        ingested_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ingested At
        note:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - status
      - value
      - hour_start
      - daylight
      - ingested_at
      title: UvIndex
      type: object
    ValidationPair:
      additionalProperties: false
      properties:
        reading_id:
          title: Reading Id
          type: integer
        taken_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Taken At
        measured:
          title: Measured
          type: number
        estimated:
          title: Estimated
          type: number
        error:
          description: Model estimate minus kit measurement, in analyte units.
          title: Error
          type: number
      required:
      - reading_id
      - taken_at
      - measured
      - estimated
      - error
      title: ValidationPair
      type: object
    VolumeEventOnPond:
      properties:
        user_id:
          anyOf:
          - exclusiveMinimum: 0
            type: integer
          - type: 'null'
          default: null
          description: Optional; when sent it must be the pond in the path.
          title: User Id
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Timestamp
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The event's UUID, the same value the app writes to pondInterventions.event_id.
            An event_id the pond has already applied is not applied again. Optional for older app builds.
          title: Event Id
        volume_percent:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 100
            type: number
          - type: 'null'
          default: null
          title: Volume Percent
        volume_litres:
          anyOf:
          - exclusiveMinimum: 0
            maximum: 1000000
            type: number
          - type: 'null'
          default: null
          title: Volume Litres
      title: VolumeEventOnPond
      type: object
    WaterChemistryAssessment:
      additionalProperties: true
      properties:
        status:
          description: Green, Amber or Red.
          title: Status
          type: string
        category:
          title: Category
          type: string
        advisory:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Advisory
        evaluated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Set on a stored evaluation row.
          title: Evaluated At
        id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Id
        userid:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Userid
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'Backend version that made the assessment: the package version, plus +g<commit>
            when known. null on a row stored before provenance was recorded (unknown).'
          title: Model Version
        input_cutoff:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Newest sensor sample, event or camera frame time the model had taken in (UTC),
            as distinct from evaluated_at, when it was computed. null when unknown or before any input.
          title: Input Cutoff
        forecast_issued_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Weather provider's issue time of the forecast used, when every forecast record
            used shares it; null when unknown or mixed (see inputs.forecasts).
          title: Forecast Issued At
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: 'What the run applied: run, sensor_groups, events, camera_frames, ratings, and
            per forecast product its cache records with their issue times. null on a row stored before
            provenance was recorded.'
          title: Inputs
        data_confidence:
          anyOf:
          - $ref: '#/components/schemas/DataConfidence'
          - type: 'null'
          default: null
          description: 'How current the sensor data behind it is. Not stored: added to every assessment
            the API returns. Named apart from the algae assessment''s own confidence, which is about its
            growth-rate fit.'
        tan_ppm:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Tan Ppm
        no2_ppm:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: No2 Ppm
        no3_ppm:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: No3 Ppm
        ph_reactivity:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Ph Reactivity
        reactivity_trend:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Reactivity Trend
        tds_trend:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Tds Trend
        sensor_warnings:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          default: null
          title: Sensor Warnings
        add_hardener_now:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Add Hardener Now
        risk_score:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: In a fresh assessment only; no column stores it.
          title: Risk Score
      required:
      - status
      - category
      title: WaterChemistryAssessment
      type: object
    WaterChemistryForecast:
      additionalProperties: true
      properties:
        uncertainty:
          $ref: '#/components/schemas/ProjectionUncertainty'
          description: Low/central/high constants from koi/models/uncertainty.json. The existing trajectory
            remains central.
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'Backend version that computed the forecast: the package version, plus +g<commit>
            when known.'
          title: Model Version
        input_cutoff:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Newest sensor sample, event or camera frame time the model had taken in (UTC);
            null before any input.
          title: Input Cutoff
        trajectory:
          items:
            $ref: '#/components/schemas/ForecastDay'
          title: Trajectory
          type: array
        first_watch_days_from_now:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: First Watch Days From Now
        first_high_risk_days_from_now:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: First High Risk Days From Now
        first_nitrite_days_from_now:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: First Nitrite Days From Now
        predicted_action_days_from_now:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Predicted Action Days From Now
        caveat:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Caveat
        avg_daily_tan_mg:
          title: Avg Daily Tan Mg
          type: number
        temp_baseline:
          $ref: '#/components/schemas/DailyStats'
        lux_baseline:
          anyOf:
          - $ref: '#/components/schemas/DailyStats'
          - type: 'null'
      required:
      - uncertainty
      - trajectory
      - avg_daily_tan_mg
      - temp_baseline
      - lux_baseline
      title: WaterChemistryForecast
      type: object
    WeatherNow:
      additionalProperties: false
      properties:
        kind:
          const: observed
          default: observed
          title: Kind
          type: string
        air_temperature:
          $ref: '#/components/schemas/WeatherValue'
        rainfall:
          $ref: '#/components/schemas/WeatherValue'
        wind_speed:
          $ref: '#/components/schemas/WeatherValue'
        uv_index:
          $ref: '#/components/schemas/UvIndex'
      required:
      - air_temperature
      - rainfall
      - wind_speed
      - uv_index
      title: WeatherNow
      type: object
    WeatherValue:
      additionalProperties: false
      description: 'One NEA station reading from the latest cache (weather_telemetry),

        from the pond''s assigned station for that metric only.'
      properties:
        metric:
          enum:
          - air_temperature
          - rainfall
          - wind_speed
          title: Metric
          type: string
        status:
          enum:
          - ok
          - stale
          - missing
          title: Status
          type: string
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        unit:
          description: degC; mm over the 5 minutes ending at observed_at; knot.
          title: Unit
          type: string
        station_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Station Id
        observed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Provider time of the reading (weather_telemetry.source_times); null for a cache
            row written before migration 0009.
          title: Observed At
        ingested_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the cache row was last written (updated_at).
          title: Ingested At
        fresh_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: observed_at (or ingested_at when observed_at is null) plus one hour.
          title: Fresh Until
        note:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - metric
      - status
      - value
      - unit
      - station_id
      - observed_at
      - ingested_at
      - fresh_until
      title: WeatherValue
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Supabase access token of the pond's account.
