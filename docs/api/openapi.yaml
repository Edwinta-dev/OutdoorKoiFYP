        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '401':
          description: Not signed in
          content: &id005
            application/json:
              schema: *id001
        '403':
          description: Another account's pond
          content: *id005
        '404':
          description: Pond or assessment not found
          content: *id005
        '500':
          description: Unexpected server error
          content: *id005
        '503':
          description: Storage or service not available
          content: *id005
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/assessments/chemistry:
    get:
      operationId: get_latest_assessment
      summary: Latest water chemistry assessment
      tags:
      - assessments
      description: Most recent chemistry assessment, whether produced by a poll tick or by an event endpoint's
        immediate re-assessment.
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      - name: If-None-Match
        in: header
        required: false
