components:
  schemas:
    AlgaeAssessment:
      additionalProperties: true
      properties:
        status:
          description: Green, Amber or Red.
          title: Status
          type: string
        category:
          title: Category
          type: string
        advisory:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Advisory
        evaluated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Set on a stored evaluation row.
          title: Evaluated At
        id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Id
        userid:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Userid
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'Backend version that made the assessment: the package version, plus +g<commit>
            when known. null on a row stored before provenance was recorded (unknown).'
          title: Model Version
        input_cutoff:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Newest sensor sample, event or camera frame time the model had taken in (UTC),
            as distinct from evaluated_at, when it was computed. null when unknown or before any input.
          title: Input Cutoff
        forecast_issued_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Weather provider's issue time of the forecast used, when every forecast record
            used shares it; null when unknown or mixed (see inputs.forecasts).
          title: Forecast Issued At
        inputs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: 'What the run applied: run, sensor_groups, events, camera_frames, ratings, and
            per forecast product its cache records with their issue times. null on a row stored before
            provenance was recorded.'
          title: Inputs
        data_confidence:
          anyOf:
          - $ref: '#/components/schemas/DataConfidence'
          - type: 'null'
          default: null
          description: 'How current the sensor data behind it is. Not stored: added to every assessment
            the API returns. Named apart from the algae assessment''s own confidence, which is about its
            growth-rate fit.'
        green_ratio:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Green Ratio
        watch_threshold:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Watch Threshold
        action_threshold:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Action Threshold
        threshold_mode:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Threshold Mode
        growth_rate_per_day:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Growth Rate Per Day
        intrinsic_rate_per_day:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Intrinsic Rate Per Day
        rate_source:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Rate Source
        confidence:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Confidence
        sample_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Sample Count
        days_to_scrub:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Days To Scrub
        scrub_now:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Scrub Now
        calibrated:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Calibrated
        camera_drift:
          anyOf:
          - type: string
          - type: 'null'
          default: null
