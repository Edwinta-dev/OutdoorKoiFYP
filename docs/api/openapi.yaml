          title: Source Row Id
        ingested_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'SensorData.created_at: when the database stored the row, not when the probe sampled.'
          title: Ingested At
        sample_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'When the probe sampled. Always null until the node sends a sample time (issue
            #17).'
