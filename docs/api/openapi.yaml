openapi: 3.1.0
info:
  title: OutdoorKoi digital twin API
  version: '1'
  description: 'Digital twin API of OutdoorKoi: pond chemistry, evaporation and algae.


    Every pond route is served under /v1. The retired mobile aliases are not served.

    /health and /ready are also served unversioned for probes. /metrics is Prometheus text.


    GET responses with a JSON body carry a strong `ETag` and

    `Cache-Control: private, no-cache`; send it back in `If-None-Match` to get

    304 with no body when nothing in the response has changed. Freshness is

    part of the body, so a reading going stale changes the ETag.


    Every non-2xx response is the ErrorEnvelope. Generated by

    `python -m koi.api.openapi` from Backend/koi/api; do not edit by hand.

    Field rules for the dashboard: docs/api/README.md.

    '
servers:
- url: /
tags:
- name: pond
- name: assessments
- name: forecasts
- name: events
- name: ratings
- name: service
paths:
  /health:
    get:
      operationId: unversioned_health
      summary: Liveness
      tags:
      - service
      description: 'Liveness: the process is up and answering. Checks nothing else.'
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              description: Strong validator over the response body.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-cache
        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      tags:
      - service
      security: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
  /ready:
    get:
      operationId: unversioned_ready
      summary: Readiness
      tags:
      - service
      description: 'Readiness: storage answers and the poller succeeded recently (koi/api/health.py).
        503 with the error envelope when not.'
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id036
                $ref: '#/components/schemas/Ready'
          headers:
            ETag:
              description: Strong validator over the response body.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-cache
        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '500':
          description: Unexpected server error
          content: &id002
            application/json:
              schema: *id001
        '503':
          description: Storage or service not available
          content: *id002
      security: []
  /v1/health:
    get:
      operationId: health
      summary: Liveness
      tags:
      - service
      description: 'Liveness: the process is up and answering. Checks nothing else.'
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
          headers:
            ETag:
              description: Strong validator over the response body.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-cache
        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
      security: []
  /v1/ponds/{pond}/assessments:
    get:
      operationId: get_all_assessments
      summary: All three latest assessments and the hypoxia flag
      tags:
      - assessments
      description: All three cached assessments in one call - lets the dashboard populate every outcome
        card and its alert badge from a single request instead of three - plus the night-time hypoxia
        flag.
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllAssessments'
          headers:
            ETag:
              description: Strong validator over the response body.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-cache
        '304':
          description: 'Not modified: If-None-Match matches the current ETag. No body.'
        '401':
          description: Not signed in
          content: &id004
            application/json:
              schema: *id001
        '403':
          description: Another account's pond
          content: *id004
        '404':
          description: Pond or assessment not found
          content: *id004
        '500':
          description: Unexpected server error
          content: *id004
        '503':
          description: Storage or service not available
          content: *id004
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/assessments/algae:
