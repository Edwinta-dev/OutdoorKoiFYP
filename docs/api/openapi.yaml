  /v1/ponds/{pond}/events/algae-rating:
    post:
      operationId: log_algae_rating
      summary: Rate the algae in a camera frame
      tags:
      - events
      description: 'Body: {user_id, severity, image_id?, green_ratio?, notes?} severity: "none" | "minor"
        | "moderate" | "severe" | "obstruction" image_id identifies the frame being rated. Strongly preferred
        over letting the server guess "the latest frame": if the user rates at 9pm and the newest photo
        is from 6pm, an implicit pairing silently corrupts the calibration set. When omitted the server
        falls back to the newest frame and says so in the response.'
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgaeRatingEventOnPond'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgaeRatingResult'
        '400':
          description: Invalid request
          content: &id014
            application/json:
              schema: *id001
        '401':
          description: Not signed in
          content: *id014
        '403':
          description: Another account's pond
          content: *id014
        '404':
          description: Pond or assessment not found
          content: *id014
        '500':
          description: Unexpected server error
          content: *id014
        '503':
          description: Storage or service not available
          content: *id014
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/events/algae-rating/undo:
    post:
      operationId: undo_algae_rating
      summary: Undo the most recent algae rating
      tags:
      - events
      description: 'Reverses the most recent rating. Body: {user_id, rating_id?} Only the most recent
        rating is exactly reversible - that is the mis-tap case the undo affordance exists for. The engine
        restores the level, thresholds, growth fit and camera history it had beforehand, and the persisted
        row is deleted so it leaves the calibration set too.'
      parameters:
      - name: pond
        in: path
        required: true
        description: The pond (UserData.userID); must be the signed-in account's pond.
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgaeRatingUndoOnPond'
      responses:
