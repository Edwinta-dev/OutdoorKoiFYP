            application/json:
              schema:
                $ref: '#/components/schemas/AlgaeRatingUndoResult'
        '400':
          description: Invalid request
          content: &id015
            application/json:
              schema: *id001
        '401':
          description: Not signed in
          content: *id015
        '403':
          description: Another account's pond
          content: *id015
        '404':
          description: Pond or assessment not found
          content: *id015
        '409':
          description: Conflict
          content: *id015
        '500':
          description: Unexpected server error
          content: *id015
        '503':
          description: Storage or service not available
          content: *id015
