        '404':
          description: Pond or assessment not found
          content: *id008
        '500':
          description: Unexpected server error
          content: *id008
        '503':
          description: Storage or service not available
          content: *id008
      security:
      - bearerAuth: []
  /v1/ponds/{pond}/camera/mask:
    get:
      operationId: get_camera_mask
      summary: Camera water mask
      tags:
      - pond
      description: 'The mask in force and every saved version, oldest first. mask is null when none has
