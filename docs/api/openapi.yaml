          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaltEventOnPond'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id017
        '400':
          description: Invalid request
          content: &id020
            application/json:
              schema: *id001
        '401':
          description: Not signed in
          content: *id020
        '403':
          description: Another account's pond
