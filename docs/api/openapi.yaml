          title: Newest Reading At
        expected_interval_seconds:
          description: The sensor node's expected interval used here.
          title: Expected Interval Seconds
          type: integer
        never_seen:
          description: Channels this assessment can use that have never reported (for example no TDS probe).
            They do not lower the level.
          items:
            type: string
          title: Never Seen
          type: array
      required:
      - level
      - reasons
      - newest_reading_at
      - expected_interval_seconds
      - never_seen
      title: DataConfidence
      type: object
    DeviceHealth:
      additionalProperties: false
      properties:
        kind:
          enum:
          - sensor
          - camera
          title: Kind
          type: string
        status:
          description: 'late: past its expected time; silent: nothing for 3 expected intervals; never_seen:
            no contact yet.'
          enum:
          - ok
          - late
          - silent
          - never_seen
          title: Status
          type: string
        last_seen_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Receipt time of the newest contact (devices.last_seen_at). A node sending old buffered
            readings is seen now while its channels stay old.
          title: Last Seen At
        next_expected_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the newest contact said it would report next.
          title: Next Expected At
        expected_interval_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Interval Seconds
        interval_source:
          description: 'device: configured on the devices row; default: the backend''s sensor cadence;
            schedule: the camera''s last wake; unknown: no contact yet.'
          enum:
          - device
          - default
          - schedule
          - unknown
          title: Interval Source
          type: string
        window_hours:
          title: Window Hours
          type: integer
        received_24h:
          description: Contacts received in the window.
          title: Received 24H
          type: integer
        missed_24h:
          anyOf:
          - type: integer
          - type: 'null'
          description: Expected reports in the window that did not arrive, counted against the interval
            in force at each contact; null before the first contact.
          title: Missed 24H
        battery:
          $ref: '#/components/schemas/BatteryTrend'
        last_reset:
          anyOf:
          - $ref: '#/components/schemas/ResetReason'
          - type: 'null'
          description: Newest reset reason the node sent; null when none.
        channels:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ChannelHealth'
            type: object
          - type: 'null'
          description: 'Sensor node only: ph, tds, temp, lux.'
          title: Channels
        clock:
          anyOf:
          - $ref: '#/components/schemas/ClockNote'
          - type: 'null'
          description: Sensor node only.
      required:
      - kind
      - status
      - last_seen_at
      - next_expected_at
      - expected_interval_seconds
      - interval_source
      - window_hours
      - received_24h
      - missed_24h
      - battery
      - last_reset
      - channels
      - clock
      title: DeviceHealth
      type: object
